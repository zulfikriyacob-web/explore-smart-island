<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skrin kuiz — Explore Smart Island</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Token — docs/DESIGN.md §2–4 */
  :root{
    --laut-cetek:#E6F7F4; --putih:#FFFFFF; --arang:#1F3A34; --arang-lembut:#5C7A72; --garis:#D3E8E3;
    --laut:#0FB5A6; --laut-gelap:#087A70; --laut-light:#D6F5F1;
    --daun:#2FBF71; --daun-light:#DFF6E9; --bunga:#FF6B6B; --nila:#5B5BD6;
    --shadow-float:0 8px 24px -6px rgb(31 58 52 / .18);
    --ease-out:cubic-bezier(.16,1,.3,1); --ease-back:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--laut-cetek);color:var(--arang);font-family:Lexend,system-ui,sans-serif;font-size:18px;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible{outline:4px solid var(--nila);outline-offset:2px}

  .skrin{position:relative;height:100dvh;min-height:640px;max-width:430px;margin:0 auto;overflow:hidden}

  /* 45% atas — baca / tonton. Tiada butang jawapan di sini. */
  .atas{position:absolute;inset:0 0 55% 0;display:flex;flex-direction:column;gap:20px;padding:24px 16px 0}
  .kemajuan{display:flex;align-items:center;gap:12px}
  .trek{flex:1;height:12px;border-radius:9999px;background:var(--garis);overflow:hidden}
  .isi{height:100%;border-radius:9999px;background:var(--laut);transform-origin:left;transform:scaleX(var(--p,.3));transition:transform .4s var(--ease-out)} /* scaleX, bukan width */
  .kaunter{font-weight:600;font-size:15px;line-height:1.35;color:var(--arang-lembut);font-variant-numeric:tabular-nums}
  .kad{background:var(--putih);border-radius:28px;padding:24px;box-shadow:var(--shadow-float);display:flex;flex-direction:column;gap:16px}
  .audio{width:64px;height:64px;border-radius:9999px;border:3px solid var(--laut);background:var(--putih);display:grid;place-items:center;padding:0;transition:transform .12s var(--ease-out)}
  .audio:active{background:var(--laut-light);transform:scale(.94)}
  .soalan{margin:0;font-size:22px;line-height:1.4;font-weight:500;text-align:left}

  /* 55% bawah — zon ibu jari */
  .bawah{position:absolute;left:0;right:0;bottom:0;height:55%;padding:16px 16px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px}
  .jawapan{
    position:relative;width:100%;min-height:88px;padding:0 24px;border-radius:20px;
    background:var(--putih);border:4px solid var(--laut);box-shadow:0 4px 0 0 var(--laut-gelap);
    color:var(--arang);font-family:'Baloo 2',system-ui,sans-serif;font-weight:600;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;gap:12px;
    transition:transform .12s var(--ease-out),opacity .2s,background-color .15s,border-color .15s
  }
  .jawapan:active{transform:translateY(4px);box-shadow:none;background:var(--laut-light)} /* Ditekan */
  .jawapan .ikon{display:none;width:36px;height:36px;border-radius:9999px;place-items:center}
  .jawapan .ikon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
  .cincin{position:absolute;inset:-4px;border-radius:24px;border:3px solid var(--daun);opacity:0;pointer-events:none}

  .jawapan.betul{background:var(--daun-light);border-color:var(--daun);box-shadow:0 4px 0 0 var(--daun);animation:pulse .32s var(--ease-back)}
  .jawapan.betul .ikon-betul{display:grid;background:var(--daun)}
  .jawapan.betul .cincin{animation:ring .5s var(--ease-out) forwards}

  .jawapan.salah{border-color:var(--bunga);box-shadow:0 4px 0 0 var(--bunga);animation:shake .34s ease-in-out}
  .jawapan.salah .ikon-salah{display:grid;background:var(--bunga)}

  .jawapan.lumpuh{opacity:.35;transform:scale(.96);border-color:var(--garis);box-shadow:0 4px 0 0 var(--garis);pointer-events:none}

  @keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(9px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
  @keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.6);opacity:0}}
  @media (prefers-reduced-motion: reduce){.jawapan,.cincin,.isi{animation:none!important;transition:opacity .15s}}
</style>
</head>
<body>
<main class="skrin">
  <section class="atas">
    <div class="kemajuan" role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="10" aria-label="Kemajuan">
      <div class="trek"><div class="isi" style="--p:.3"></div></div>
      <span class="kaunter">3 / 10</span>
    </div>
    <div class="kad">
      <button class="audio" aria-label="Main audio soalan">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F3A34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
      <p class="soalan" lang="ms">Nombor manakah yang lebih besar?</p>
    </div>
  </section>

  <section class="bawah" aria-live="polite" data-betul="b">
    <button class="jawapan" data-id="a" aria-label="Jawapan 47"><span class="cincin"></span><span>47</span><span class="ikon ikon-betul" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="ikon ikon-salah" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span></button>
    <button class="jawapan" data-id="b" aria-label="Jawapan 74"><span class="cincin"></span><span>74</span><span class="ikon ikon-betul" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="ikon ikon-salah" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span></button>
    <button class="jawapan" data-id="c" aria-label="Jawapan 38"><span class="cincin"></span><span>38</span><span class="ikon ikon-betul" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="ikon ikon-salah" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span></button>
  </section>
</main>
<script>
  // Demo keadaan sahaja — enjin kuiz sebenar menggantikan blok ini.
  const zon = document.querySelector('.bawah'), betul = zon.dataset.betul;
  zon.addEventListener('click', e => {
    const b = e.target.closest('.jawapan'); if (!b || b.classList.contains('betul') || b.classList.contains('salah')) return;
    if (b.dataset.id === betul) {
      b.classList.add('betul');
      zon.querySelectorAll('.jawapan:not(.betul)').forEach(x => x.classList.add('lumpuh'));
    } else {
      b.classList.add('salah');
      setTimeout(() => { b.classList.remove('salah'); b.classList.add('lumpuh'); }, 340);
    }
  });
</script>
</body>
</html>
