document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;min-height:72px;border-radius:20px;background:#fff;border:4px solid #D3E8E3;box-shadow:0 4px 0 0 #D3E8E3;color:#1F3A34;font:600 22px/1 'Baloo 2';cursor:pointer\" style-active=\"transform:translateY(4px);box-shadow:none\">{{ again }}<\u002Fbutton>\n            <button style=\"width:100%;min-height:88px;border-radius:20px;background:#fff;border:4px solid #0FB5A6;box-shadow:0 4px 0 0 #087A70;color:#1F3A34;font:600 24px/1 'Baloo 2';cursor:pointer\" style-active=\"transform:translateY(4px);box-shadow:none\">{{ next }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px;max-width:320px;padding-top:36px\">\n        <button sc-camel-on-click=\"{{ replay }}\" style=\"align-self:flex-start;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid #D3E8E3;background:#fff;font:500 15px/1 Lexend;color:#1F3A34;cursor:pointer\" style-active=\"transform:scale(.97)\">Main semula animasi<\u002Fbutton>\n        <ul style=\"margin:0;padding-left:18px;font:400 14px/1.6 Lexend;color:#5C7A72;display:flex;flex-direction:column;gap:6px\">\n          <li>E1 Bintang jatuh: skala 0→1.25→1, putar −25°→0°, spring.cheer 0.45 s, berperingkat 180 ms, satu bunyi `star` setiap satu.<\u002Fli>\n          <li>Tiada confetti — E2 hanya pada ⭐⭐⭐. Kancil main GEMBIRA (isCorrect), bukan celebrate.<\u002Fli>\n          <li>--mangga muncul di sini sahaja. Bekas ketiga kosong dilukis sebagai garis --garis, bukan bintang kelabu berisi — supaya jelas ia belum diperoleh.<\u002Fli>\n          <li>\"Seterusnya\" duduk pada slot bawah yang sama seperti skrin kuiz (DESIGN §5.2). \"Main lagi\" 72px di atasnya.<\u002Fli>\n          <li>Kancil di sini bentuk asas sahaja — pengganti ilustrasi.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- DELIVERABLE 3 -->\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <h2 style=\"margin:0;font:600 22px/1.2 'Baloo 2'\">Deliverable 3 · Spesifikasi gerakan kancil<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n\n      <!-- 1e prototaip -->\n      <div id=\"1e\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font:600 12px/1 Lexend;background:#1F3A34;color:#fff;border-radius:9999px;padding:6px 10px\">1e<\u002Fspan><span style=\"font:500 14px/1 Lexend;color:#5C7A72\">Prototaip gerakan · bentuk asas<\u002Fspan><\u002Fdiv>\n        <div style=\"width:520px;background:#fff;border-radius:28px;border:1px solid #D3E8E3;padding:24px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box\">\n          <div style=\"background:#E6F7F4;border-radius:20px;padding:16px;display:flex;justify-content:center;position:relative\">\n            <div style=\"position:absolute;left:16px;top:12px;font:500 12px/1 Lexend;color:#5C7A72;background:#fff;border-radius:6px;padding:5px 8px\">soalan ↖<\u002Fdiv>\n            <svg data-kancil=\"1\" data-mood=\"{{ mood }}\" data-anim=\"{{ anim }}\" data-slow=\"{{ slowAttr }}\" sc-camel-view-box=\"0 0 260 200\" width=\"390\" height=\"300\" style=\"overflow:visible\" aria-hidden=\"true\">\n              <ellipse cx=\"128\" cy=\"188\" rx=\"76\" ry=\"6\" fill=\"#D3E8E3\"><\u002Fellipse>\n              <g data-part=\"all\">\n                <g data-part=\"leg-bl\"><rect x=\"78\" y=\"150\" width=\"12\" height=\"36\" rx=\"6\" fill=\"#4A625B\"><\u002Frect><\u002Fg>\n                <g data-part=\"leg-br\"><rect x=\"98\" y=\"152\" width=\"12\" height=\"34\" rx=\"6\" fill=\"#4A625B\"><\u002Frect><\u002Fg>\n                <g data-part=\"leg-fl\"><rect x=\"138\" y=\"150\" width=\"12\" height=\"36\" rx=\"6\" fill=\"#4A625B\"><\u002Frect><\u002Fg>\n                <g data-part=\"leg-fr\"><rect x=\"158\" y=\"152\" width=\"12\" height=\"34\" rx=\"6\" fill=\"#4A625B\"><\u002Frect><\u002Fg>\n                <g data-part=\"tail\"><ellipse cx=\"58\" cy=\"118\" rx=\"6\" ry=\"10\" fill=\"#7A958D\"><\u002Fellipse><\u002Fg>\n                <g data-part=\"body\"><ellipse cx=\"118\" cy=\"132\" rx=\"60\" ry=\"40\" fill=\"#5C7A72\"><\u002Fellipse><\u002Fg>\n                <g data-part=\"head-pose\"><g data-part=\"head\">\n                  <g data-part=\"ear-l\"><ellipse cx=\"168\" cy=\"56\" rx=\"8\" ry=\"18\" fill=\"#7A958D\"><\u002Fellipse><\u002Fg>\n                  <g data-part=\"ear-r\"><ellipse cx=\"196\" cy=\"54\" rx=\"8\" ry=\"18\" fill=\"#7A958D\"><\u002Fellipse><\u002Fg>\n                  <circle cx=\"182\" cy=\"88\" r=\"28\" fill=\"#5C7A72\"><\u002Fcircle>\n                  <ellipse cx=\"206\" cy=\"96\" rx=\"14\" ry=\"10\" fill=\"#5C7A72\"><\u002Fellipse>\n                  <circle cx=\"216\" cy=\"94\" r=\"4\" fill=\"#1F3A34\"><\u002Fcircle>\n                  <g data-part=\"eye-l\"><circle cx=\"176\" cy=\"84\" r=\"4\" fill=\"#1F3A34\"><\u002Fcircle><\u002Fg>\n                  <g data-part=\"eye-r\"><circle cx=\"194\" cy=\"82\" r=\"4\" fill=\"#1F3A34\"><\u002Fcircle><\u002Fg>\n                <\u002Fg><\u002Fg>\n              <\u002Fg>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:12px;font:500 15px/1.35 Lexend;color:#5C7A72\">\n            <span style=\"font:600 13px/1 Lexend;letter-spacing:.04em\">KancilSM<\u002Fspan>\n            <span>Mood: {{ moodName }}<\u002Fspan><span>Reaksi: {{ reactName }}<\u002Fspan>\n            <span>isThinking = {{ thinkingText }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <button sc-camel-on-click=\"{{ fireCorrect }}\" style=\"min-height:64px;border-radius:20px;background:#fff;border:4px solid #2FBF71;box-shadow:0 4px 0 0 #2FBF71;font:600 18px/1 Lexend;color:#1F3A34;cursor:pointer\" style-active=\"transform:translateY(4px);box-shadow:none\">isCorrect ↯<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ fireWrong }}\" style=\"min-height:64px;border-radius:20px;background:#fff;border:4px solid #FF6B6B;box-shadow:0 4px 0 0 #FF6B6B;font:600 18px/1 Lexend;color:#1F3A34;cursor:pointer\" style-active=\"transform:translateY(4px);box-shadow:none\">isWrong ↯<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ fireCelebrate }}\" style=\"min-height:64px;border-radius:20px;background:#fff;border:4px solid #FFB627;box-shadow:0 4px 0 0 #FFB627;font:600 18px/1 Lexend;color:#1F3A34;cursor:pointer\" style-active=\"transform:translateY(4px);box-shadow:none\">celebrate ↯<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toggleThinking }}\" style=\"min-height:64px;border-radius:20px;background:{{ thinkFace }};border:4px solid #0FB5A6;box-shadow:0 4px 0 0 #087A70;font:600 18px/1 Lexend;color:#1F3A34;cursor:pointer\" style-active=\"transform:translateY(4px);box-shadow:none\">isThinking = {{ thinkingText }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n            <button sc-camel-on-click=\"{{ toggleSlow }}\" style=\"min-height:44px;padding:0 16px;border-radius:12px;border:2px solid #D3E8E3;background:{{ slowFace }};font:500 14px/1 Lexend;color:#1F3A34;cursor:pointer\">Perlahan 4× : {{ slowText }}<\u002Fbutton>\n            <span style=\"font:400 13px/1.4 Lexend;color:#5C7A72\">↯ = Trigger. Ketuk jawapan di <a href=\"#1a\">1a<\u002Fa> juga memicu kancil ini.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- spesifikasi -->\n      <div style=\"width:720px;display:flex;flex-direction:column;gap:28px;font:400 15px/1.6 Lexend;color:#1F3A34\">\n\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <h3 style=\"margin:0;font:600 20px/1.2 'Baloo 2'\">a) Kontrak Rive · artboard \"Kancil\" · state machine \"KancilSM\"<\u002Fh3>\n          <div style=\"display:grid;grid-template-columns:130px 90px 1fr;border:1px solid #D3E8E3;border-radius:12px;overflow:hidden;font-size:14px\">\n            <div style=\"padding:8px 12px;background:#E6F7F4;font-weight:600\">Input<\u002Fdiv><div style=\"padding:8px 12px;background:#E6F7F4;font-weight:600\">Jenis<\u002Fdiv><div style=\"padding:8px 12px;background:#E6F7F4;font-weight:600\">Apa yang ia buat dalam KancilSM<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">isCorrect<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Trigger<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Lapisan Reaksi: Kosong → GEMBIRA<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">isWrong<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Trigger<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Lapisan Reaksi: Kosong → SIMPATI<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">celebrate<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Trigger<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Lapisan Reaksi: Kosong → RAYA (skrin ringkasan 3 bintang sahaja)<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">isThinking<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Boolean<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Lapisan Mood: MELAHU (false) ⇄ FIKIR (true)<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;color:#C25A16;font-size:14px;text-wrap:pretty\"><strong style=\"font-weight:600\">Perubahan kontrak:<\u002Fstrong> input <span style=\"font-family:ui-monospace,monospace\">mood<\u002Fspan> (Number) dibuang. isThinking sudah menentukan MELAHU/FIKIR sepenuhnya, dan nilai 2/3 tidak mempunyai kesan — input mati mengundang kegagalan senyap. SPEC.md §11 perlu dikemas kini kepada empat input di atas sebelum kod ditulis.<\u002Fp>\n          <p style=\"margin:0;color:#5C7A72;font-size:14px;text-wrap:pretty\">Dua lapisan dalam satu state machine, kedua-duanya bermain serentak (Rive mencampur lapisan secara aditif): <strong style=\"font-weight:600;color:#1F3A34\">Mood<\u002Fstrong> (MELAHU, FIKIR — gelung, dikawal isThinking) dan <strong style=\"font-weight:600;color:#1F3A34\">Reaksi<\u002Fstrong> (KOSONG, GEMBIRA, SIMPATI, RAYA — main sekali, dikawal trigger). KOSONG ialah animasi tanpa keyframe supaya lapisan Mood terus kelihatan.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <h3 style=\"margin:0;font:600 20px/1.2 'Baloo 2'\">b) Keadaan · 60 fps, semua nilai relatif pada pangsi lapisan<\u002Fh3>\n\n          <div style=\"border:1px solid #D3E8E3;border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;background:#fff\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><strong style=\"font:600 18px/1.2 'Baloo 2'\">MELAHU · isThinking false<\u002Fstrong><span style=\"font-size:13px;color:#5C7A72;font-variant-numeric:tabular-nums\">gelung 180 bingkai (3.0 s) · ping-pong · easeInOut<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px\">\n              <li><strong style=\"font-weight:600\">Badan<\u002Fstrong> — skala Y 100→103%, X 100→101.5%, pangsi bawah-tengah.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Kepala<\u002Fstrong> — Y 0→−2px, lewat 6 bingkai daripada badan (nafas mengalir ke atas).<\u002Fli>\n              <li><strong style=\"font-weight:600\">Telinga<\u002Fstrong> — putar 0→−3°, pangsi pangkal. Telinga kanan berbeza fasa 90 bingkai.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Mata<\u002Fstrong> — kedip dalam gelung berasingan 252 bingkai (4.2 s): kelopak turun 4 bingkai, naik 5. Tempoh 3.0 dan 4.2 tidak berkongsi faktor supaya corak tidak berulang setiap kitaran.<\u002Fli>\n              <li>Kaki, ekor, hidung: pegun. Amplitud maksimum 3px / 3°. Ini ditonton beratus kali — jika ia menarik mata, kurangkan lagi.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #D3E8E3;border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;background:#fff\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><strong style=\"font:600 18px/1.2 'Baloo 2'\">FIKIR · isThinking true<\u002Fstrong><span style=\"font-size:13px;color:#5C7A72;font-variant-numeric:tabular-nums\">masuk 18 bingkai (0.3 s) · easeOut (0.16, 1, 0.3, 1) · kemudian gelung<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px\">\n              <li><strong style=\"font-weight:600\">Kepala<\u002Fstrong> — putar −8° ke arah soalan (atas skrin), Y −2px, kekal. Tiada bob.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Badan<\u002Fstrong> — nafas separuh amplitud: skala Y 101.2%, X 100.6%. Tempoh sama 3.0 s.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Telinga<\u002Fstrong> — pegun.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Mata<\u002Fstrong> — kedip setiap 360 bingkai (6 s) sahaja. Anak mata anjak 1.5px ke arah soalan jika lapisan anak mata dibekalkan.<\u002Fli>\n              <li>Keadaan ini mesti selesa ditonton 30 s tanpa apa-apa berubah. Anak sedang membaca; kancil menunggu bersama.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #D3E8E3;border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;background:#fff\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><strong style=\"font:600 18px/1.2 'Baloo 2'\">GEMBIRA · isCorrect<\u002Fstrong><span style=\"font-size:13px;color:#5C7A72;font-variant-numeric:tabular-nums\">48 bingkai (0.8 s) · sekali · backOut (0.34, 1.56, 0.64, 1)<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px\">\n              <li><strong style=\"font-weight:600\">Seluruh badan<\u002Fstrong> (kumpulan induk) — 0–9 mencangkung: Y +4px, skala X 104% Y 96% · 9–22 lompat: Y −30px, X 98% Y 104% · 22–35 mendarat: Y 0, X 103% Y 97% · 35–41 lantunan −5px · 41–48 rehat.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Telinga<\u002Fstrong> — 0–10 naik: kiri −22°, kanan +18° · tahan hingga 31 · kembali 0° pada 48.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Mata<\u002Fstrong> — 10–17 picing (skala Y 35%) · tahan hingga 34 · buka pada 48.<\u002Fli>\n              <li>Kepala tidak diputar berasingan — ia ikut badan. Satu lompat sahaja; dua lompat dikhaskan untuk RAYA.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #D3E8E3;border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;background:#fff\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><strong style=\"font:600 18px/1.2 'Baloo 2'\">SIMPATI · isWrong<\u002Fstrong><span style=\"font-size:13px;color:#5C7A72;font-variant-numeric:tabular-nums\">96 bingkai (1.6 s) · sekali · easeOut masuk, easeInOut keluar<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px\">\n              <li><strong style=\"font-weight:600\">Kepala<\u002Fstrong> — 0–15 putar +12° (senget ke arah anak, pangsi leher) · tahan 15–77 · 77–96 kembali 0°.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Telinga<\u002Fstrong> — 0–15 putar +8° mengikut kepala (bukan layu). Kembali bersama kepala.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Mata<\u002Fstrong> — satu kedip perlahan pada bingkai 27–35. Buka penuh sebelum dan selepas.<\u002Fli>\n              <li><strong style=\"font-weight:600\">Badan<\u002Fstrong> — nafas MELAHU diteruskan tanpa perubahan.<\u002Fli>\n              <li style=\"color:#C25A16\">Jangan: turunkan kepala (Y), bongkokkan badan, kecilkan mata lebih daripada satu kedip, atau jatuhkan telinga melebihi 8°. Setiap satu itu membaca sebagai \"kecewa\". Nada sasaran: \"tak apa, cuba lagi.\"<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #D3E8E3;border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;background:#fff\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><strong style=\"font:600 18px/1.2 'Baloo 2'\">RAYA · celebrate<\u002Fstrong><span style=\"font-size:13px;color:#5C7A72;font-variant-numeric:tabular-nums\">96 bingkai (1.6 s) · sekali · backOut<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px\">\n              <li>Dua lompat GEMBIRA berturut (0–30, 30–60, tinggi −28px) + lantunan kecil 60–75.<\u002Fli>\n              <li>Telinga bergoyang −16°/+14° setiap 8 bingkai sepanjang lompatan, reda 70–96. Mata picing 10–70.<\u002Fli>\n              <li>Hanya dipicu pada skrin ringkasan ⭐⭐⭐, bersama E2 confetti. Tidak pernah dalam sesi soalan.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1fr 130px 1fr;border:1px solid #D3E8E3;border-radius:12px;overflow:hidden;font-size:14px;margin-top:4px\">\n            <div style=\"padding:8px 12px;background:#E6F7F4;font-weight:600\">Peralihan<\u002Fdiv><div style=\"padding:8px 12px;background:#E6F7F4;font-weight:600\">Syarat<\u002Fdiv><div style=\"padding:8px 12px;background:#E6F7F4;font-weight:600\">Tempoh campuran (blend)<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">MELAHU → FIKIR<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">isThinking = true<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">18 bingkai (0.3 s), easeOut<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">FIKIR → MELAHU<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">isThinking = false<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">18 bingkai (0.3 s), easeOut<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">KOSONG → GEMBIRA<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">isCorrect<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">0 bingkai — potong terus. Maklum balas mesti serta-merta dengan bunyi `correct`.<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">KOSONG → SIMPATI<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">isWrong<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">6 bingkai (0.1 s)<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">KOSONG → RAYA<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">celebrate<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">0 bingkai<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">GEMBIRA / SIMPATI / RAYA → KOSONG<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">exit time 100%<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">12 bingkai (0.2 s). Lapisan Mood terus bermain di bawahnya; tiada apa yang perlu diset oleh kod.<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Trigger baharu semasa reaksi bermain<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">mana-mana trigger<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Mula semula dari bingkai 0 (benarkan peralihan ke diri sendiri, blend 0). Jangan beratur.<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;color:#5C7A72;font-size:14px;text-wrap:pretty\"><strong style=\"font-weight:600;color:#1F3A34\">prefers-reduced-motion<\u002Fstrong>: dikawal kod, bukan Rive — hentikan state machine dan papar bingkai 0 MELAHU. Reaksi betul/salah kekal disampaikan oleh ikon dan bunyi (DESIGN §7.5).<\u002Fp>\n        <\u002Fdiv>\n\n        <div id=\"1f\" style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font:600 12px/1 Lexend;background:#1F3A34;color:#fff;border-radius:9999px;padding:6px 10px\">1f<\u002Fspan><h3 style=\"margin:0;font:600 20px/1.2 'Baloo 2'\">d) Lapisan SVG yang ilustrator perlu hantar<\u002Fh3><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:170px 1fr;border:1px solid #D3E8E3;border-radius:12px;overflow:hidden;font-size:14px\">\n            <div style=\"padding:8px 12px;background:#E6F7F4;font-weight:600\">Nama lapisan<\u002Fdiv><div style=\"padding:8px 12px;background:#E6F7F4;font-weight:600\">Pangsi &amp; nota<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">telinga-kiri<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Pangsi di pangkal (sambungan ke kepala). Bentuk penuh hingga ke dalam kepala supaya putaran 22° tidak menampakkan celah.<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">telinga-kanan<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Sama. Lapisan berasingan, bukan salinan cermin dalam satu kumpulan.<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">kepala<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Termasuk muncung dan hidung. Pangsi di leher. Bertindih 8–10px ke dalam badan.<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">mata-kiri · mata-kanan<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Setiap satu: <span style=\"font-family:ui-monospace,monospace\">putih-mata<\u002Fspan>, <span style=\"font-family:ui-monospace,monospace\">anak-mata<\u002Fspan>, <span style=\"font-family:ui-monospace,monospace\">kelopak<\u002Fspan> (warna kulit kepala, di atas mata, tersembunyi di luar bentuk mata pada rehat). Kedip = kelopak turun, bukan skala mata.<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">badan<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Pangsi bawah-tengah. Tanpa bayang terbakar (baked shadow).<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">kaki-depan-kiri · kaki-depan-kanan · kaki-belakang-kiri · kaki-belakang-kanan<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Pangsi atas (pinggul/bahu). Pegun dalam v1 tetapi diperlukan berasingan untuk lompatan yang kemas dan gerakan masa depan.<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">ekor<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Pangsi pangkal. Pilihan.<\u002Fdiv>\n            <div style=\"padding:8px 12px;border-top:1px solid #D3E8E3;font-family:ui-monospace,monospace\">bayang-tanah<\u002Fdiv><div style=\"padding:8px 12px;border-top:1px solid #D3E8E3\">Elips berasingan di luar kumpulan badan — kekal di tanah semasa lompatan, mengecil 15% pada puncak.<\u002Fdiv>\n          <\u002Fdiv>\n          <ul style=\"margin:0;padding-left:18px;font-size:14px;color:#5C7A72;display:flex;flex-direction:column;gap:3px\">\n            <li>Satu fail SVG, setiap lapisan sebagai <span style=\"font-family:ui-monospace,monospace\">&lt;g id=\"…\"&gt;<\u002Fspan> dengan nama di atas. Susunan Z: bayang-tanah, kaki belakang, ekor, badan, kaki depan, telinga, kepala, mata.<\u002Fli>\n            <li>Pose neutral menghadap kanan dengan kepala 3/4, sesuai untuk putaran ±12°. Laluan (path) sahaja — tiada teks, tiada imej raster, tiada kecerunan, tiada topeng.<\u002Fli>\n            <li>Strok 4px pada 100px, hujung bulat (DESIGN §8). Palet: token §2 sahaja tambah dua neutral.<\u002Fli>\n            <li>Artboard 240 × 200 pada 1×; kancil menggunakan ~70% tinggi supaya lompatan −30px tidak terpotong.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ms&quot;,&quot;en&quot;],&quot;default&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;'ms' | 'en'&quot;,&quot;section&quot;:&quot;Kandungan&quot;},&quot;showGuides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Semakan&quot;},&quot;safeAreaSim&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:34,&quot;min&quot;:0,&quot;max&quot;:48,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Semakan&quot;},&quot;slowMo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Semakan&quot;}}\">\nclass Component extends DCLogic {\n  state = { picks: {}, mood: 0, isThinking: false, anim: null, starsRun: 1, sumAnim: 'correct', slow: false };\n  timers = {};\n  componentWillUnmount() { Object.values(this.timers).forEach(clearTimeout); }\n  k() { return (this.state.slow || this.props.slowMo) ? 4 : 1; }\n  fire(name, mood, ms) {\n    clearTimeout(this.timers.anim);\n    const go = () => {\n      this.setState({ anim: name, mood });\n      this.timers.anim = setTimeout(() => this.setState(s => ({ anim: null, mood: s.isThinking ? 1 : 0 })), ms * this.k());\n    };\n    if (this.state.anim) this.setState({ anim: null }, () => requestAnimationFrame(go)); else go();\n  }\n  pick(id) {\n    const cur = this.state.picks[id];\n    if (cur && cur !== 'rest') return;\n    if (id === 'b') {\n      const picks = {};\n      ['a', 'b', 'c'].forEach(k => { picks[k] = k === 'b' ? 'correct' : 'disabled'; });\n      this.setState({ picks });\n      this.fire('correct', 2, 800);\n    } else {\n      this.setState(s => ({ picks: { ...s.picks, [id]: 'wrong' } }));\n      clearTimeout(this.timers[id]);\n      this.timers[id] = setTimeout(() => this.setState(s => ({ picks: { ...s.picks, [id]: s.picks[id] === 'wrong' ? 'disabled' : s.picks[id] } })), 340);\n      this.fire('wrong', 3, 1600);\n    }\n  }\n  replay() {\n    this.setState({ starsRun: 0, sumAnim: null }, () => requestAnimationFrame(() => this.setState({ starsRun: 1, sumAnim: 'correct' })));\n  }\n  renderVals() {\n    const lang = this.props.lang ?? 'ms';\n    const T = lang === 'en'\n      ? { q: 'Which number is bigger?', audio: 'Play question audio', done: 'Activity complete', bravo: 'Well done!', stars: '2 of 3 stars', first: '8 of 10 right on the first try', gems: '+10 gems', again: 'Play again', next: 'Next', opt: 'Answer' }\n      : { q: 'Nombor manakah yang lebih besar?', audio: 'Main audio soalan', done: 'Aktiviti selesai', bravo: 'Syabas!', stars: '2 daripada 3 bintang', first: '8 daripada 10 betul pada cubaan pertama', gems: '+10 permata', again: 'Main lagi', next: 'Seterusnya', opt: 'Jawapan' };\n    const look = {\n      rest: { face: '#FFFFFF', border: '#0FB5A6', edge: '#087A70', opacity: 1, transform: 'none' },\n      wrong: { face: '#FFFFFF', border: '#FF6B6B', edge: '#FF6B6B', opacity: 1, transform: 'none' },\n      correct: { face: '#DFF6E9', border: '#2FBF71', edge: '#2FBF71', opacity: 1, transform: 'none' },\n      disabled: { face: '#FFFFFF', border: '#D3E8E3', edge: '#D3E8E3', opacity: 0.35, transform: 'scale(.96)' },\n    };\n    const opts = [['a', '47'], ['b', '74'], ['c', '38']].map(([id, text]) => {\n      const st = this.state.picks[id] || 'rest';\n      return { id, text, st, ...look[st], isCorrect: st === 'correct', isWrong: st === 'wrong', aria: `${T.opt} ${text}`, pick: () => this.pick(id) };\n    });\n    const reactNames = { correct: 'GEMBIRA', wrong: 'SIMPATI', celebrate: 'RAYA' };\n    const slow = this.state.slow || !!this.props.slowMo;\n    const picked = Object.values(this.state.picks);\n    return {\n      qText: T.q, audioLabel: T.audio, doneLabel: T.done, bravo: T.bravo, starsLine: T.stars, firstTry: T.first, gems: T.gems, again: T.again, next: T.next,\n      opts, reset: () => this.setState({ picks: {} }),\n      showGuides: this.props.showGuides ?? true,\n      safePad: `${this.props.safeAreaSim ?? 34}px`,\n      mood: this.state.mood, moodName: this.state.isThinking ? 'FIKIR' : 'MELAHU', reactName: reactNames[this.state.anim] || 'KOSONG', anim: this.state.anim,\n      inFeedback: picked.length > 0, hasCorrect: picked.includes('correct'),\n      thinkingText: this.state.isThinking ? 'true' : 'false', thinkFace: this.state.isThinking ? '#D6F5F1' : '#FFFFFF',\n      fireCorrect: () => this.fire('correct', 2, 800),\n      fireWrong: () => this.fire('wrong', 3, 1600),\n      fireCelebrate: () => this.fire('celebrate', 2, 1600),\n      toggleThinking: () => this.setState(s => ({ isThinking: !s.isThinking, mood: s.anim ? s.mood : (!s.isThinking ? 1 : 0) })),\n      slowAttr: slow ? '1' : '0', slowText: slow ? 'hidup' : 'mati', slowFace: slow ? '#E4E4FB' : '#FFFFFF',\n      toggleSlow: () => this.setState(s => ({ slow: !s.slow })),\n      starsRun: this.state.starsRun, sumAnim: this.state.sumAnim, replay: () => this.replay(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
