<!doctype html>
<html lang="ms" data-input="keyboard">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover is required, not optional: without it
      env(safe-area-inset-bottom) resolves to 0px on iOS and the answer stack
      sits under the home bar. DESIGN.md section 5.2.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Explore Smart Island</title>
    <!--
      Both faces ship with the app; nothing is fetched from Google. The
      @font-face rules are in src/index.css, which arrives with the bundle, so
      these preloads start the two files at parse time instead of one round
      trip later. crossorigin is required even same-origin: a font request is
      made in CORS-anonymous mode, and without it the preload is not reused.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/lexend-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/baloo2-latin.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
