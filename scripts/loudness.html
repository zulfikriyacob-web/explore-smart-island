<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelantangan klip</title>
<!--
  Langkah tetap SPEC §8: ukur kelantangan setiap klip dengan penyahkod pelayar, dan cetak arahan
  `npm run audio:gain -- apply …` yang menyamakannya. Dibuka melalui `npm run dev`, pada localhost —
  ia tidak dibina ke dalam app. Lihat scripts/audio-gain.js.
-->
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f7f6; color: #1d2a2a; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  table { border-collapse: collapse; margin: 12px 0; font-variant-numeric: tabular-nums; }
  th, td { padding: 3px 10px; border-bottom: 1px solid #c9d6d4; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  pre { white-space: pre-wrap; word-break: break-all; background: #fff; border: 1px solid #c9d6d4;
    border-radius: 8px; padding: 8px; }
  .err { color: #9b1c24; font-weight: 600; }
  .ok { color: #11663f; font-weight: 600; }
</style>
</head>
<body>
<h1>Kelantangan klip arahan</h1>
<div id="log"><p>Memuat…</p></div>
<pre id="command">—</pre>
<table id="table"></table>
<script>
  // Before the module, so a failed import is on screen and not a silent placeholder.
  const say = (text) => { const p = document.createElement('p'); p.className = 'err'; p.textContent = text; document.getElementById('log').appendChild(p); };
  window.addEventListener('error', (e) => say('error: ' + (e.message || e)));
  window.addEventListener('unhandledrejection', (e) => say('unhandledrejection: ' + ((e.reason && e.reason.stack) || e.reason)));
</script>
<script type="module" src="./loudness-page.ts"></script>
</body>
</html>
